# SyncStudy realtime service — Fly.io deployment (PLAN.md §16.3)
#
#   fly deploy --config infra/fly.realtime.toml
#
# Secrets are NOT in this file. Set them once with:
#   fly secrets set --config infra/fly.realtime.toml \
#     DATABASE_URL=... REDIS_URL=... IP_HASH_SALT=... TURN_SECRET=... \
#     ALLOWED_ORIGINS=https://syncstudy.app
#
# Two settings here are load-bearing and are the reason this file exists rather
# than `fly launch` defaults:
#
#   auto_stop_machines = false — a socket server holds long-lived connections that
#   look like idleness to Fly's autostop heuristic. Letting it stop kills every live
#   study session and costs nothing to prevent.
#
#   [http_service.concurrency] type = "connections" — the default is "requests",
#   which counts a WebSocket upgrade exactly once and therefore never load-balances
#   a socket server correctly. Counting connections is what makes the soft/hard
#   limits mean anything.

app = "syncstudy-rt"
primary_region = "iad"

[build]
  dockerfile = "apps/realtime/Dockerfile"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false      # NEVER autostop a socket server
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "connections"
    soft_limit = 2500
    hard_limit = 4000

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

[deploy]
  strategy = "rolling"
  wait_timeout = "5m"
