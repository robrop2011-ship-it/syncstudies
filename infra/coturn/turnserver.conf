# SyncStudy — coturn configuration (PLAN.md §9.3)
#
# This one file is used in two places, unchanged:
#   * local dev   — mounted read-only into the coturn container by
#                   infra/docker-compose.dev.yml
#   * production  — /etc/coturn/turnserver.conf on the Hetzner CX22 box
#
# Keeping it identical means the hardening below is reviewed in git exactly once and
# cannot drift between environments. The only lines that must differ in production
# are `static-auth-secret`, `external-ip`, and the TLS certificate paths.
#
# NOTE ON FORMAT: coturn only understands comments that occupy a whole line. A
# trailing "# ..." after a value is parsed as part of the value and the daemon
# refuses to start. Keep every comment on its own line.
#
# A TURN server is a packet relay that anyone on the internet can talk to. Out of
# the box it is a proxy into whatever network the box sits on. Every block below
# closes one specific hole; read the WHY before deleting one.


# ─────────────────────────────────────────────────────────────────────────────
# Listening sockets
#
# WHY 3478 and 5349: 3478 is the IANA STUN/TURN port — UDP first, with TCP as the
# fallback for networks that drop UDP outright. 5349 is TURN-over-TLS, which is what
# actually rescues a student on locked-down university Wi-Fi where everything except
# TLS is blocked. Both are required; shipping only UDP loses ~10% of peer pairs.
# ─────────────────────────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349

# WHY 0.0.0.0: inside Docker the container's address is not knowable ahead of time,
# and on the Hetzner box coturn should answer on its single public NIC.
listening-ip=0.0.0.0

# WHY external-ip matters: coturn advertises the address it BELIEVES it has in every
# relay candidate. Behind Docker NAT or a cloud NAT it believes a private address,
# hands that to the browser, and every relayed connection fails in a way that looks
# exactly like "TURN is broken". Set this to the box's public IPv4 in production.
# Local dev leaves it unset — all peers are on the same host.
#external-ip=<PUBLIC_IPV4>


# ─────────────────────────────────────────────────────────────────────────────
# Authentication — short-lived, per-user HMAC credentials (the REST mechanism)
#
# WHY use-auth-secret: the alternative is a fixed username/password, which has to be
# shipped to the browser, which means anyone who opens devtools owns a free relay and
# the 20 TB monthly allowance becomes someone else's torrent box. With the
# shared-secret mechanism the realtime service mints
#     username   = <unix-expiry>:<userId>
#     credential = base64(HMAC-SHA1(secret, username))
# per call join, valid for 10 minutes (TURN_CREDENTIAL_TTL_SEC in @syncstudy/shared).
# A leaked credential expires on its own and is attributable to one account.
# ─────────────────────────────────────────────────────────────────────────────
use-auth-secret

# WHY this literal value: it is a DEV-ONLY placeholder, and it matches TURN_SECRET in
# .env.example so `pnpm services:up` yields a working local TURN with zero setup.
# IN PRODUCTION: replace it with `openssl rand -base64 32`, keep it out of git, and
# make sure the realtime service's TURN_SECRET is byte-identical. A mismatch fails
# every allocation with 401 and is indistinguishable from "TURN is down".
static-auth-secret=dev-turn-secret-change-me

# WHY realm: the long-term-credential mechanism hashes the realm into the key, so it
# is part of the credential rather than decoration. It must match on both sides
# forever; changing it invalidates every outstanding credential at once.
realm=syncstudy.app

# WHY: bounds how long a captured nonce stays replayable.
stale-nonce=600


# ─────────────────────────────────────────────────────────────────────────────
# The peer denylist — the misconfiguration that matters most
#
# WHY: without these lines an authenticated client can ask the relay to forward
# packets to ANY address the server can reach — 10.0.0.0/8, the Docker bridge, the
# cloud metadata endpoint at 169.254.169.254, localhost. That turns the relay into an
# open proxy into your own private network, and it is one of the most frequently
# exploited TURN misconfigurations in the wild. A legitimate relay only ever needs to
# reach other participants' PUBLIC addresses, so denying everything else costs
# nothing and closes the hole completely.
#
# IPv4 — every private, reserved and special-purpose range.
# ─────────────────────────────────────────────────────────────────────────────
# 0.0.0.0/8 — "this network"
denied-peer-ip=0.0.0.0-0.255.255.255
# 10.0.0.0/8 — RFC1918 private
denied-peer-ip=10.0.0.0-10.255.255.255
# 100.64.0.0/10 — RFC6598 carrier-grade NAT
denied-peer-ip=100.64.0.0-100.127.255.255
# 127.0.0.0/8 — loopback; reaches services on the host itself
denied-peer-ip=127.0.0.0-127.255.255.255
# 169.254.0.0/16 — link-local, and the cloud metadata endpoint 169.254.169.254
denied-peer-ip=169.254.0.0-169.254.255.255
# 172.16.0.0/12 — RFC1918 private; also Docker's default bridge pool
denied-peer-ip=172.16.0.0-172.31.255.255
# 192.0.0.0/24 — IETF protocol assignments
denied-peer-ip=192.0.0.0-192.0.0.255
# 192.0.2.0/24 — TEST-NET-1
denied-peer-ip=192.0.2.0-192.0.2.255
# 192.88.99.0/24 — deprecated 6to4 anycast
denied-peer-ip=192.88.99.0-192.88.99.255
# 192.168.0.0/16 — RFC1918 private
denied-peer-ip=192.168.0.0-192.168.255.255
# 198.18.0.0/15 — benchmarking
denied-peer-ip=198.18.0.0-198.19.255.255
# 198.51.100.0/24 — TEST-NET-2
denied-peer-ip=198.51.100.0-198.51.100.255
# 203.0.113.0/24 — TEST-NET-3
denied-peer-ip=203.0.113.0-203.0.113.255
# 224.0.0.0/4 — multicast
denied-peer-ip=224.0.0.0-239.255.255.255
# 240.0.0.0/4 — reserved, including the 255.255.255.255 broadcast address
denied-peer-ip=240.0.0.0-255.255.255.255

# IPv6 — the same holes exist here and are easier to forget, because the host may be
# dual-stacked even when you are certain it is not.
# ::1 — loopback
denied-peer-ip=::1
# :: — unspecified
denied-peer-ip=::
# ::ffff:0:0/96 — IPv4-mapped addresses; without this an attacker reaches every
# IPv4 range denied above by simply writing it in IPv6 form
denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff
# fc00::/7 — unique-local (RFC4193)
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# fe80::/10 — link-local
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# ff00::/8 — multicast
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# WHY also this: multicast is never a legitimate WebRTC destination and is a traffic
# amplification vector. Belt and braces alongside the ranges above.
no-multicast-peers


# ─────────────────────────────────────────────────────────────────────────────
# Quotas — the bill is part of the attack surface
#
# TURN is bandwidth-bound, and bandwidth is the cost. Without quotas one abusive or
# compromised account saturates the box and burns the monthly egress allowance in an
# afternoon, taking every call down with it.
#
#   total-quota — max simultaneous allocations server-wide.
#   user-quota  — max simultaneous allocations per username. A participant in a mesh
#                 call needs a handful of relayed candidate pairs at most; 12 is
#                 generous for the 8-person audio mesh (MESH_AUDIO_MAX) and still
#                 caps a client stuck in an ICE-restart loop.
#   max-bps     — per-allocation ceiling in BYTES per second. 800 kB/s sits far above
#                 the 32 kbps Opus and 500 kbps video caps from §9.4, so it never
#                 degrades a real call, but it stops the relay being used as a bulk
#                 file transfer pipe.
# ─────────────────────────────────────────────────────────────────────────────
total-quota=200
user-quota=12
max-bps=800000

# WHY there is no min-port/max-port here: coturn needs ONE relay port per
# allocation, so pinning a 40-port range while advertising total-quota=200 would
# fail every allocation past the 41st with "508 Insufficient Capacity". The
# default 49152-65535 range matches the quota above, so production inherits it.
#
# Local dev DOES need a small range (publishing 16k ports through Docker's
# userland proxy takes minutes to start), but that belongs in
# infra/docker-compose.dev.yml as CLI flags — not in this file, which must stay
# byte-identical to what runs in production.


# ─────────────────────────────────────────────────────────────────────────────
# Attack surface reduction
# ─────────────────────────────────────────────────────────────────────────────
# WHY no-cli: coturn's telnet admin console listens on 127.0.0.1:5766 by default with
# a well-known default password. Inside a container, "localhost" is shared with every
# other process in that network namespace. Nothing here needs the console, so remove
# it entirely rather than trying to secure it.
no-cli

# WHY: coturn otherwise advertises its exact version in every response, which is free
# reconnaissance for anyone scanning for a known CVE.
no-software-attribute

# WHY fingerprint: adds the FINGERPRINT attribute to STUN messages. WebRTC requires
# it, and it is what lets the relay safely demultiplex STUN from media on a shared
# port.
fingerprint

# WHY these two: TLS 1.0 and 1.1 are deprecated and broken, and leaving them enabled
# only helps a downgrade attack. In production point cert/pkey at the real
# certificate for turn.syncstudy.app (Let's Encrypt via certbot is fine — coturn
# re-reads them on SIGHUP). Local dev uses plain 3478 and never negotiates TLS.
no-tlsv1
no-tlsv1_1
#cert=/etc/coturn/certs/turn.syncstudy.app.pem
#pkey=/etc/coturn/certs/turn.syncstudy.app.key

# WHY no-tcp-relay is deliberately NOT set: relaying over TCP is exactly what saves
# the student behind a firewall that drops all UDP. Leave TCP relaying enabled.


# ─────────────────────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────────────────────
# WHY stdout: containers ship stdout. A log file inside a container is a log nobody
# reads on a disk nobody trims. `simple-log` keeps it to one line per event.
log-file=stdout
simple-log

# WHY verbose stays off: at verbose level coturn logs peer addresses for every
# allocation, which means student IP addresses sitting in a log file — exactly the
# data §11.9 says never to retain. Enable it to debug, never leave it enabled.
#verbose
